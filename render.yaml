services:
  - type: web
    name: vanswill-school-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: school-db
      mountPath: /data
      sizeGB: 1
